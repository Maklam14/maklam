<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Designs — thiago Bento</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="header">
    <div class="container nav">
      <a href="index.html" class="logo">Maklam<span>.</span></a>
      <div class="actions">
        <button id="langBtn" class="btn-small">EN</button>
        <button id="themeBtn" class="btn-small">◐</button>
      </div>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <a href="index.html#projects" class="back" data-i18n="back"></a>
        <h1 data-i18n="design_title"></h1>
        <p class="lead" data-i18n="design_text"></p>
      </div>
    </section>

    <section class="section alt">
      <div class="container">
        <div class="cards">
          <article class="card">
            <div class="thumb"><img src="assets/design/5.jpg" alt="Projeto 1"></div>
            <h3>ILUSTRAÇÕES VARIADAS</h3>
            <p>Ilustrações Digitais de Variados temas.</p>
            <a href="#" class="link open-gallery"
              data-gallery="assets/design/1.jpg, assets/design/2.jpg, assets/design/3.jpg, assets/design/4.jpg, assets/design/5.jpg">Ver
              →</a>
          </article>
          <!-- copie o bloco <article> inteiro para cada novo projeto -->
          <article class="card">
            <div class="thumb"><img src="assets/motorsport/1.jpg" alt="Projeto 1"></div>
            <h3>MOTORSPORT</h3>
            <p>Designs do mundo automotivo.</p>
            <a href="#" class="link open-gallery"
              data-gallery="assets/motorsport/1.jpg, assets/motorsport/2.jpg, assets/motorsport/3.jpg, assets/motorsport/4.jpg, assets/motorsport/5.jpg,
              assets/motorsport/6.png, assets/motorsport/7.jpg, assets/motorsport/8.jpg">Ver
              →</a>
          </article>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container"><span>© <span id="year"></span> Thiago Bento</span></div>
  </footer>

  <div class="modal" id="modal" aria-hidden="true">
    <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
    <div class="modal-body">
      <h3 id="modalTitle"></h3>
      <div class="gallery" id="gallery"></div>
    </div>
  </div>
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose" aria-label="Close">✕</button>
    <img id="lightboxImg" alt="">
  </div>
  <script src="script.js"></script>
</body>

</html>
